global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: worker               # DNS service discovery returns every replica of the scaled service
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: stub-llm
    metrics_path: /healthz         # liveness only (up{job="stub-llm"})
    static_configs: [{targets: ["stub-llm:8081"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
